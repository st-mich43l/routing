name: Deploy

# Deploys via the shared Ansible playbooks in st-mich43l/ansible-library.
# All deploy config for "routing" lives in ansible-library group_vars; the only
# secret this repo needs is the Ansible vault password.

on:
  push:
    branches: [master]
    paths:
      - "deployment-template/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    uses: st-mich43l/action-library/.github/workflows/deploy-ansible.yml@master
    with:
      project: routing
      # Pinned on purpose: bump it whenever routing's vars change in ansible-library
      # (hostnames, certificate domains), or the deploy keeps rendering the old .env.
      # 8038980 = deploy-user cron fix + photobooth.apexvoid.net (ansible-library #161).
      ansible-library-ref: 8038980e565dffb486a83ee2de3cf8c7c5a37dd6
    secrets:
      vault-password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
      # ansible-library-token: ${{ secrets.ANSIBLE_LIBRARY_TOKEN }}  # only if ansible-library is private

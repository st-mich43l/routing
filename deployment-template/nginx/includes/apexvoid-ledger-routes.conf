location = /_routing/health {
  access_log off;
  default_type text/plain;
  return 200 "ok\n";
}

location = /api/health {
  set $apexvoid_ledger_backend http://apexvoid-ledger-backend:4000;
  proxy_pass $apexvoid_ledger_backend;
  include /etc/nginx/includes/proxy-headers.conf;
}

location /api/ {
  set $apexvoid_ledger_backend http://apexvoid-ledger-backend:4000;
  proxy_pass $apexvoid_ledger_backend;
  include /etc/nginx/includes/proxy-headers.conf;
}

location / {
  set $apexvoid_ledger_frontend http://apexvoid-ledger-frontend:80;
  proxy_pass $apexvoid_ledger_frontend;
  include /etc/nginx/includes/proxy-headers.conf;
}

client_max_body_size 2m;

location = /_routing/health {
  access_log off;
  default_type text/plain;
  return 200 "ok\n";
}

location = /health {
  set $void_occult_backend http://voidocc-backend:8000;
  proxy_pass $void_occult_backend;
  include /etc/nginx/includes/proxy-headers.conf;
}

location ^~ /api/debug/ {
  return 404;
}

location /api/ {
  set $void_occult_backend http://voidocc-backend:8000;
  proxy_pass $void_occult_backend;
  include /etc/nginx/includes/proxy-headers.conf;

  # /api/interpret streams plain-text model output.
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 300s;
}

location / {
  set $void_occult_frontend http://voidocc-frontend:80;
  proxy_pass $void_occult_frontend;
  include /etc/nginx/includes/proxy-headers.conf;
}

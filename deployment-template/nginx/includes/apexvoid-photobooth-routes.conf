location = /_routing/health {
  access_log off;
  default_type text/plain;
  return 200 "ok\n";
}

# Static product website (apexvoid-photobooth, `webpage` branch): one Nginx
# container serving pre-built HTML on port 80. The router's own security headers
# are authoritative, so the site's duplicates are dropped instead of being sent twice.
location / {
  set $apexvoid_photobooth_webpage http://apexvoid-photobooth-webpage:80;
  proxy_pass $apexvoid_photobooth_webpage;
  include /etc/nginx/includes/proxy-headers.conf;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header Referrer-Policy;
}

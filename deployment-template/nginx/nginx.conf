user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  # Limit by the TCP peer; do not trust client-supplied forwarding headers.
  # ACME and the local health check must remain available during a burst.
  map $uri $routing_rate_key {
    default $binary_remote_addr;
    ~^/\.well-known/acme-challenge/ "";
    /_routing/health "";
  }
  limit_req_zone $routing_rate_key zone=routing_per_ip:10m rate=15r/s;
  limit_req_status 429;

  # These paths have no purpose in our applications and are common probes.
  map $uri $routing_probe {
    default 0;
    "~*(^|/)\.(?!well-known(?:/|$))" 1;
    "~*\.(?:php[0-9]?|phtml)(?:/|$|\.)" 1;
    "~*^/(?:wp-admin|wp-content|wp-includes|phpmyadmin|actuator)(?:/|$)" 1;
    "~*^/(?:vendor/composer|storage/logs)(?:/|$)" 1;
  }

  # Include only the rendered routing table, not the image's sample site.
  include /etc/nginx/conf.d/routes.conf;
}

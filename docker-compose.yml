services:
  nginx:
    image: nginx:alpine
    container_name: central-routing
    restart: unless-stopped
    ports:
      - "${ROUTING_HTTP_PORT:-80}:80"
    environment:
      NGINX_ENVSUBST_FILTER: "^(VOID_OCCULT_HOST|VOID_OCCULT_LOCAL_HOST)$"
      VOID_OCCULT_HOST: "${VOID_OCCULT_HOST:-stvoid.duckdns.org}"
      VOID_OCCULT_LOCAL_HOST: "${VOID_OCCULT_LOCAL_HOST:-void-occult.localhost}"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates/routes.conf.template:/etc/nginx/templates/routes.conf.template:ro
      - ./nginx/includes:/etc/nginx/includes:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/_routing/health >/dev/null || exit 1
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - routing

networks:
  routing:
    name: "${ROUTING_NETWORK:-routing}"
    driver: bridge
